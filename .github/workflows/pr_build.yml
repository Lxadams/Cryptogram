name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel in-progress runs for the same PR/branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-projects:
    name: Build & Test (${{ matrix.project-path }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Add all your subfolder paths containing a Cargo.toml here
        project-path:
          - "code/server"
          - "code/client"
          - "code/frontend"
          - "code/frontend/src-tauri"

    defaults:
      run:
        working-directory: ${{ matrix.project-path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Enable Swatinem Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      # code/frontend/src-tauri is the native desktop shell (GTK/webkit2gtk),
      # not pure Rust like the other crates — ubuntu-latest doesn't ship
      # these by default, so it needs its own install step before it can
      # even be type-checked, let alone built.
      - name: Install Tauri Linux build dependencies
        if: matrix.project-path == 'code/frontend/src-tauri'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run Clippy (Linter)
        run: cargo clippy -- -D warnings

      - name: Build project
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose