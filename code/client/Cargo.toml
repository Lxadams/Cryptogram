[package]
name = "client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
x25519-dalek = { version = "2.0.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10.1"
# ML-KEM-768 (FIPS 203), for the PQ half of the session handshake and the
# PQ ratchet refreshes: Cryspen's formally verified implementation (see
# src/pq.rs). Same key and ciphertext sizes as the round-3 Kyber it
# replaced, so no payload changed size.
libcrux-ml-kem = { version = "0.0.11", default-features = false, features = ["mlkem768"] }
hkdf = "0.12.3"
sha2 = "0.10.8"
hmac = "0.12.1"
rand_core = { version = "0.6.4", features = ["std"] }
hex = "0.4.3"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
# RaptorQ forward error correction for lossy links — see src/transport.rs.
fec = { path = "../fec" }
# The client <-> relay link protocol, shared with the relay so the two can't
# drift apart.
relay-link = { path = "../relay-link" }

[dev-dependencies]
fec = { path = "../fec", features = ["test-util"] }

# Argon2id (see `ARGON2_M_COST_KIB` in code/client/src/lib.rs) is built
# optimised even in debug builds and tests, where it would otherwise take
# many seconds per login.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
