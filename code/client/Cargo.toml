[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
x25519-dalek = { version = "2.0.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10.1"
pqcrypto-kyber = "0.8.1"
hkdf = "0.12.3"
sha2 = "0.10.8"
hmac = "0.12.1"
rand_core = { version = "0.6.4", features = ["std"] }
hex = "0.4.3"
pqcrypto-traits = "0.3.5"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
# RaptorQ forward error correction for lossy links — see src/transport.rs.
fec = { path = "../fec" }
# The link to the relay: cells over QUIC, shared with the relay (see
# src/link.rs and code/cell).
cell = { path = "../cell" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
# Looks up the relay's name over DNS-over-HTTPS, never plaintext DNS.
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio", "https-aws-lc-rs", "webpki-roots"] }

[dev-dependencies]
fec = { path = "../fec", features = ["test-util"] }
# The real relay logic, run in-process over lossy in-memory links by the
# link tests (src/link/tests.rs).
server = { path = "../server" }
tokio = { version = "1", features = ["full", "test-util"] }
