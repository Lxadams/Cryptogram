[package]
name = "e2e-messenger"
version = "0.1.0"
description = "Tauri desktop shell for the E2E-Messenger Leptos UI"
authors = ["Compx374 team"]
license = ""
repository = ""
edition = "2021"
# Bumped from 1.77.2: identity session locking (see commands.rs's
# resolve_login) uses std::fs::File::try_lock, stabilized in 1.89.
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "e2e_messenger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# The real crypto/networking engine — this is the whole point of the Tauri
# shell: run the exact same client code the CLI uses, with a real UDP
# socket, instead of reimplementing the protocol against a browser-only
# transport.
client = { path = "../../client" }
tokio = { version = "1", features = ["net", "sync", "rt-multi-thread", "macros"] }
ed25519-dalek = "3.0.0"
chacha20poly1305 = "0.10.1"
hex = "0.4.3"
zeroize = "1"

# Linux's webview (WebKitGTK) ships with camera access (getUserMedia) off
# and denies unhandled permission requests, so the QR scanner needs a small
# opt-in there (see `enable_camera_for_qr_scanner` in src/lib.rs). Same
# major version wry/Tauri already use; `v2_8` exposes the video/audio check
# on permission requests.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_8"] }
