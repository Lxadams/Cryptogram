# Without this, Trunk's default watch covers the whole code/frontend tree,
# including src-tauri/ — which has its own separate build (cargo/cargo-tauri
# already recompiles it on source changes) and, at runtime, is where the
# backend writes client_state.json (see src-tauri/src/commands.rs). Trunk
# picking that file write up as a "source changed" event was triggering a
# full WASM rebuild + hot-reload of the running app a moment after every
# successful connect, wiping all in-memory UI state (the exact bug: the
# app flashing to the main screen then reverting to the Connect screen).
[watch]
ignore = ["src-tauri"]
