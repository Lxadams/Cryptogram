[package]
name = "relay-link"
version = "0.1.0"
edition = "2024"
publish = false

# The client <-> relay link protocol, shared by code/client and code/server
# so the two sides can't drift apart (see src/lib.rs).
[dependencies]
chacha20poly1305 = "0.10.1"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
hkdf = "0.12.3"
sha2 = "0.10.8"
x25519-dalek = { version = "2.0.0", features = ["static_secrets"] }

[dev-dependencies]
rand_core = { version = "0.6.4", features = ["std"] }
