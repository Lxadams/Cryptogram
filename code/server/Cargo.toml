[package]
name = "server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1"
x25519-dalek = { version = "2.0.0", features = ["static_secrets"] }
sha2 = "0.10.8"
rand_core = { version = "0.6.4", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
hex = "0.4.3"
hmac = "0.12.1"
# The client <-> relay link protocol, shared with the client so the two
# can't drift apart.
relay-link = { path = "../relay-link" }
# To keep the relay's memory out of core dumps and debuggers (see
# `keep_memory_private` in src/main.rs). Already in the tree via tokio.
libc = "0.2"
