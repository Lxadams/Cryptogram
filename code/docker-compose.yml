services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: server
    ports:
      - "443:443/udp"
    environment:
      - RUST_LOG=info
    volumes:
      - server_identity:/data
    restart: unless-stopped
    # A fixed address, so the client can be given an IP: a name would be
    # looked up over DNS-over-HTTPS, which can't see Compose's service names.
    networks:
      relay:
        ipv4_address: 172.30.0.10

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on:
      - server
    environment:
      - SERVER_ADDR=172.30.0.10:443
      - SERVER_ACCESS_KEY=${SERVER_ACCESS_KEY:-}
      - RUST_LOG=info
    volumes:
      - client_state:/data
    networks:
      - relay
    stdin_open: true
    tty: true
    # Interactive REPL — run with `docker compose run`, not `up`. The client
    # ships with the relay's key pin and access key rather than asking it:
    #   docker compose exec server server --print-pubkey
    #   docker compose exec server server --print-access-key
    # Left blank by default (rather than a hard Compose-level requirement)
    # so `docker compose up server` etc. aren't blocked by them being unset;
    # the binary itself says what's missing if you forget:
    #   SERVER_PUBKEY=<hex> SERVER_ACCESS_KEY=<hex> docker compose run --rm client
    command: ["${SERVER_PUBKEY:-}"]

  # Build-only: compiles the Tauri desktop shell into a Linux .deb/AppImage.
  # Final stage is FROM scratch (no shell, no CMD/ENTRYPOINT) — there's
  # nothing to run, so it's kept out of a plain `docker compose up` via the
  # profile gate. Build and extract the bundle with:
  #   docker compose build frontend-builder
  #   docker compose create frontend-builder
  #   docker cp $(docker compose ps -a -q frontend-builder):/bundle ./frontend-bundle
  #   docker compose rm -f frontend-builder
  # (or skip Compose and use `docker buildx build --target artifacts
  # --output type=local,...` directly — see frontend/Dockerfile's header)
  frontend-builder:
    profiles: ["build-only"]
    build:
      context: .
      dockerfile: frontend/Dockerfile

volumes:
  server_identity:
  client_state:

networks:
  relay:
    ipam:
      config:
        - subnet: 172.30.0.0/24